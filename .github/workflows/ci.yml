name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-jwt-secret-key-for-testing-purposes-only-0123456789-abcdefghijklmnop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: OWASP dependency check
        working-directory: backend
        run: mvn -B -q org.owasp:dependency-check-maven:12.2.2:check -DfailBuildOnCVSS=9 -DskipTestScope=true
        continue-on-error: true

      - name: Build and verify backend with coverage
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B verify jacoco:report

      - name: Print & Publish JaCoCo Coverage Summary
        if: always()
        run: |
          if [ -f backend/target/site/jacoco/jacoco.csv ]; then
            awk -F',' 'NR>1 {
              inst_m+=$4; inst_c+=$5; branch_m+=$6; branch_c+=$7; line_m+=$8; line_c+=$9
            } END {
              printf "JaCoCo Summary -> Instructions: %.2f%% | Branches: %.2f%% | Lines: %.2f%%\n",
                (inst_c/(inst_m+inst_c))*100, (branch_c/(branch_m+branch_c))*100, (line_c/(line_m+line_c))*100
            }' backend/target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
